name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      # Packaging is the step most likely to break on metadata problems
      # (missing icon, bad repository field, oversized bundle), so it runs on
      # every change rather than only at release time.
      - name: Package
        run: npx vsce package --out claude-noti.vsix

      - uses: actions/upload-artifact@v4
        with:
          name: claude-noti-vsix
          path: claude-noti.vsix
          retention-days: 14
