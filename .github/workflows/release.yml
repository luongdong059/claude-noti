name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # A tag that disagrees with package.json would publish a version nobody
      # can trace back to a commit, so fail loudly before anything is uploaded.
      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $PKG"
            exit 1
          fi
          echo "releasing version $PKG"

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: Package
        run: npx vsce package --out claude-noti.vsix

      - name: Publish the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: claude-noti.vsix
          generate_release_notes: true

      # Both publish steps are skipped when their token is not configured, so
      # a release still succeeds before the Marketplace account exists.
      - name: Publish to the VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        if: ${{ env.VSCE_PAT != '' }}
        run: npx vsce publish --packagePath claude-noti.vsix

      # Open VSX is what Cursor, Windsurf and VSCodium install from.
      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        if: ${{ env.OVSX_PAT != '' }}
        run: npx ovsx publish claude-noti.vsix --pat "$OVSX_PAT"

      - name: Report what was skipped
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          [ -n "$VSCE_PAT" ] || echo "::warning::VSCE_PAT is not set — skipped the VS Code Marketplace"
          [ -n "$OVSX_PAT" ] || echo "::warning::OVSX_PAT is not set — skipped Open VSX"
